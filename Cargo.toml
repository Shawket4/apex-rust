[package]
name = "apex"
version = "0.1.0"
edition = "2021"
[[bin]]
name = "apex-rust"
path = "src/main.rs"
[dependencies]
# Web framework
actix-web = { version = "4.4", features = ["openssl"] }
actix-cors = "0.7"
openssl = { version = "0.10", features = ["vendored"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "bigdecimal"
] }


# Serialization
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.1"
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# JWT Authentication
jsonwebtoken = "9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Environment variables
dotenv = "0.15"

# Logging
env_logger = "0.11"
log = "0.4"

# Utilities
once_cell = "1.19"
futures-util = "0.3.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
