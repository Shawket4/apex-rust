[package]
name = "apex"
version = "0.1.0"
edition = "2021"
[[bin]]
name = "apex-rust"
path = "src/main.rs"
[dependencies]
# Web framework
actix-web = { version = "4.4", features = ["openssl"] }
actix-cors = "0.7"
openssl = { version = "0.10", features = ["vendored"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
# 0.8 rather than 0.7: cargo reports sqlx-postgres 0.7.4 as containing code a
# future rustc will reject, and `migrate` + `set_migration_table` is needed to
# keep this service's migration bookkeeping out of public._sqlx_migrations,
# which apex-petroapp owns in the same database.
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
    "rust_decimal",
    "migrate"
] }


# Serialization
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.1"
serde_json = "1.0"
# double_option: PATCH bodies must distinguish "field absent" from "field: null".
serde_with = "3"

# Server-side XLSX export (pure Rust, no native deps).
rust_xlsxwriter = "0.79"

# SHA-384 of the baseline migration, so the cutover can stamp
# banksms._sqlx_migrations with the checksum sqlx::migrate! expects.
sha2 = "0.10"

# Money. NEVER f64 for currency amounts: NUMERIC(18,4) <-> rust_decimal::Decimal.
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"

# Date/Time. chrono-tz carries the Africa/Cairo rules; Egypt observes DST, so a
# fixed +2/+3 offset silently produces wrong timestamps half the year.
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Bank-SMS template matching. Compiled once and cached; see parser::templates.
regex = "1"

# HTTP client for the WhatsApp Go API (localhost, no auth today).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# JWT Authentication
jsonwebtoken = "9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Environment variables
dotenv = "0.15"

# Logging
env_logger = "0.11"
log = "0.4"

# Utilities
once_cell = "1.19"
futures-util = "0.3.31"
rmp = "0.8.15"
sentry = "0.49"
sentry-actix = "0.49"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[dev-dependencies]
base64 = "0.23.1"
